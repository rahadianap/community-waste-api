services:
  postgres:
    image: postgres:16-alpine
    container_name: waste_api_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: waste_collection_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d waste_collection_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waste_api_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_PORT: 8080
      BASE_URL: http://localhost:8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: waste_collection_db
      DB_SSLMODE: disable
      UPLOAD_DIR: ./uploads/payments
      MAX_UPLOAD_SIZE_MB: 5
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads

volumes:
  pgdata:
